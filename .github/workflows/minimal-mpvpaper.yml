name: Build Minimal mpvpaper

on:
  workflow_dispatch: # Allows you to trigger the build manually from the GitHub UI

jobs:
  build-minimal:
    runs-on: ubuntu-latest
    container: archlinux:latest

    steps:
      - name: Update system and install build dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel git meson ninja ffmpeg wayland wayland-protocols libxkbcommon mesa libglvnd egl-wayland

      - name: Clone mpv repository
        run: git clone --depth 1 https://github.com/mpv-player/mpv.git

      - name: Configure minimal libmpv
        working-directory: ./mpv
        run: |
          meson setup build \
            -Dlibmpv=true \
            -Dcplayer=false \
            -Dlua=disabled \
            -Djavascript=disabled \
            -Dalsa=disabled \
            -Dpulse=disabled \
            -Dpipewire=disabled \
            -Dtv=disabled \
            -Ddvdnav=disabled \
            -Dcdda=disabled \
            -Duchardet=disabled \
            -Dwayland=enabled \
            -Dvaapi=enabled \
            -Dx11=disabled \
            -Dvulkan=disabled \
            -Ddrm=disabled \
            -Dopenal=disabled
            
      - name: Compile and install custom libmpv
        working-directory: ./mpv
        run: |
          meson compile -C build
          meson install -C build

      - name: Clone mpvpaper repository
        run: git clone https://github.com/GhostNaN/mpvpaper.git

      - name: Configure and build mpvpaper
        working-directory: ./mpvpaper
        run: |
          meson setup build
          meson compile -C build

      - name: Gather Artifacts
        run: |
          mkdir -p output_artifacts
          cp mpvpaper/build/mpvpaper output_artifacts/
          cp /usr/local/lib/libmpv.so* output_artifacts/
          
      - name: Upload Minimal Build
        uses: actions/upload-artifact@v4
        with:
          name: minimal-mpvpaper-arch
          path: output_artifacts/
